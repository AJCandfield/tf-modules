name: CI

on:
  pull_request:
    paths:
      - "modules/**"
      - ".tflint.hcl"
      - ".mise.toml"
      - ".pre-commit-config.yaml"
      - "terraform-docs.yml"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/toolchain-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  modules:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ajcandfield/tf-modules-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      security-events: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: reviewdog/action-setup@v1
      - name: Install tflint plugins
        run: tflint --init
      - name: Detect changed modules
        id: changed
        run: |
          MODULES="$(scripts/changed-modules.sh "origin/${{ github.base_ref }}")"
          echo "$MODULES"
          {
            echo 'modules<<EOF'
            echo "$MODULES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Check changed modules
        if: steps.changed.outputs.modules != ''
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports/sarif reports/junit reports/checkstyle
          while IFS= read -r module; do
            slug="${module//\//-}"
            echo "::group::$module"
            terraform fmt -check "$module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
            tflint --chdir="$module" --config="$GITHUB_WORKSPACE/.tflint.hcl" \
              --format sarif --force > "reports/sarif/$slug.sarif"
            tflint --chdir="$module" --config="$GITHUB_WORKSPACE/.tflint.hcl" \
              --format junit --force > "reports/junit/$slug.xml"
            (
              cd "$module"
              tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format checkstyle --force \
                | tee "$GITHUB_WORKSPACE/reports/checkstyle/$slug.xml" \
                | reviewdog -f=checkstyle -name=tflint -reporter=github-check -fail-level=none
            )
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.modules }}"
      - name: Upload SARIF to code scanning
        if: steps.changed.outputs.modules != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: reports/sarif
          category: tflint
      - name: Publish JUnit reports
        if: steps.changed.outputs.modules != ''
        uses: dorny/test-reporter@v3
        with:
          name: tflint
          path: reports/junit/*.xml
          reporter: java-junit
          fail_on_error: "false"
          fail_on_empty: "false"
      - name: Upload raw reports
        if: steps.changed.outputs.modules != ''
        uses: actions/upload-artifact@v7
        with:
          name: tflint-reports
          path: reports/
          retention-days: 14

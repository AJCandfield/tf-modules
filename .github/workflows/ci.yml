name: CI

on:
  pull_request:
    paths:
      - "modules/**"
      - ".mise.toml"
      - ".tflint.hcl"
      - ".pre-commit-config.yaml"
      - "terraform-docs.yml"
      - "scripts/**"
      - "docker/ci/**"
      - "renovate.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  modules:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ajcandfield/tf-modules/ci@sha256:07f9ce96b46cd8c02d7fd79212d3dc5113473d961a1e1348e2881148da0466fa
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install tflint plugins
        run: tflint --init
      - name: Detect changed modules
        id: changed
        run: |
          MODULES="$(scripts/changed-modules.sh "origin/${{ github.base_ref }}")"
          echo "$MODULES"
          {
            echo 'modules<<EOF'
            echo "$MODULES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Check changed modules
        id: check
        if: steps.changed.outputs.modules != ''
        run: |
          lint_failed=0
          while IFS= read -r module; do
            echo "::group::$module"
            terraform fmt -check "$module"
            terraform-docs --config "$GITHUB_WORKSPACE/terraform-docs.yml" --output-check "$module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
            if ! tflint --chdir="$module" --config="$GITHUB_WORKSPACE/.tflint.hcl" \
              --format compact; then
              lint_failed=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.modules }}"
          echo "lint_failed=$lint_failed" >> "$GITHUB_OUTPUT"
      - name: Enforce TFLint findings
        if: steps.changed.outputs.modules != '' && steps.check.outputs.lint_failed == '1'
        run: exit 1
